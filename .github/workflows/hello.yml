# The name displayed in the GitHub Actions tab.
name: Hello World with Java

# Events that start this workflow.
on:
  # Run when code is pushed to main.
  push:
    branches:
      - main
  # Allow the workflow to be started manually from the Actions tab.
  workflow_dispatch:

# A workflow is made of one or more jobs.
jobs:
  # The ID of this job.
  hello-java:
    # The name shown for this job in the Actions UI.
    name: Compile and run the Java Hello World program
    # The type of virtual machine (runner) the job runs on.
    runs-on: ubuntu-latest

    # Steps run in order on the runner.
    steps:
      # Download the repository's files onto the runner.
      - name: Check out the repository
        uses: actions/checkout@v4

      # Install a Java Development Kit so javac and java are available.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          # Use the Eclipse Temurin build of the JDK.
          distribution: temurin
          # Use Java version 17.
          java-version: '17'

      # Compile Hello.java into Hello.class (Java bytecode).
      - name: Compile the Java program
        run: javac Hello.java

      # Run the compiled program with the environment variable set.
      - name: Run the Java program
        env:
          # The name the program will greet.
          WHO_TO_GREET: 'GitHub Actions Student'
        # Run the Hello class; output appears in the workflow log.
        run: java Hello
